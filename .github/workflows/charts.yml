name: Refresh Stats and Signal Map

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills_map.json"
      - "scripts/stat_cards.py"
      - "scripts/neural_map.py"
      - ".github/workflows/charts.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Self-hosted stat + repo cards — pulls live data straight from the
      # GitHub REST API using this Action's own token (5,000 req/hour,
      # never the shared public-instance rate limit).
      - name: Stat and repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/stat_cards.py --user "${{ github.repository_owner }}" --out assets

      # Neural Signal Map — static except when you edit skills_map.json
      - name: Neural signal map
        run: python scripts/neural_map.py --data assets/skills_map.json -o assets/neural-map

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stat-card-*.svg assets/repo-card-*.svg assets/neural-map-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats and signal map"
          git push
